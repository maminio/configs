[hud]
# Overall panel alpha. Color alpha values below still apply.
opacity = 0.5

header_text = "{workspace}"

# Header supports {workspace}, {row}, and {col}.
# Layout.
tile_width = 20
tile_height = 20
minimum_width = 180
margin = 14
gap = 8
header_height = 0
screen_padding = 8

# Spotlight-style magnet: dragging Mission Control sticks to the screen's
# horizontal center within this many pixels. 0 disables the snap.
mission_snap_threshold = 24

# Menu bar status item (whole-setup health + actions). Set false to hide.
show_menu_bar = true

# Timing.
auto_hide_delay = 1.6

# Shape and chrome.
background_corner_radius = 12
tile_corner_radius = 7
label_corner_radius = 5
selected_border_width = 3.5
occupied_border_width = 1
shadow = true

# Fonts.
header_font_size = 14
workspace_font_size = 10.5
app_font_size = 9.5
tile_label_max_apps = 3

# Colors accept #RGB, #RGBA, #RRGGBB, or #RRGGBBAA.
background_color = "#0e100dc2"
background_border_color = "#f2eba357"
tile_color = "#2e38298a"
selected_color = "#ff670efa"
occupied_border_color = "#f5f7e642"
label_background_color = "#0b0d0b8f"
empty_label_background_color = "#0b0d0b61"
header_text_color = "#f5f7e6fa"
workspace_text_color = "#f2f5e8fa"
app_text_color = "#f5f7edeb"

# Native macOS 26 Liquid Glass used by Mission Control.
[mission_control]
# "clear" emphasizes lensing; "regular" is frostier and more adaptive.
glass_style = "clear"
corner_radius = 15
panel_opacity = 1.0
glass_tint_color = "#a2a2a2"
glass_tint_opacity = 0.5

# Exact color layer inside native glass. Lower opacity preserves more lensing.
background_color = "#6a6a6a98"
background_opacity = 0.62

# Workspace content drawn inside the single glass plane.
tile_color = "#ffffff12"
empty_tile_color = "#ffffff12"
tile_border_color = "#fff8f8"
tile_border_width = 0.2
tile_corner_radius = 15
hover_color = "#ce212114"

# Focused workspace, drop targets, drag previews, and edge + action.
accent_color = "#0a0a0ac7"
accent_border_color = "#050505ff"
accent_text_color = "#f5f5f5ff"

# Unselected labels and window rows.
primary_text_color = "#ffffff"
secondary_text_color = "#ffffff"
row_text_color = "#ffffff"

# Rename or hide app labels. Key = the real app name (case-insensitive),
# value = what to show. Empty string hides the label (icon still shows).
# Real names searchable; only the displayed text changes.
[app_names]
"Google Chrome" = ""
"Ghostty" = "term"
